<title>Cardiovascular Innovation Forum 2026</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout concept: a fixed contents rail on the left (echoing the report's contents page),
   a reading column on the right, and full-width navy "part divider" bands echoing the PDF. */
:root{
  --navy:#15263b; --navy-2:#1f3350; --red:#d9463b; --red-ink:#c23a30;
  --bg:#ffffff; --bg-2:#f3f4f5; --bg-3:#e9ebee; --line:#d9dde3; --line-2:#c4cad3;
  --fg:#15263b; --fg-2:#3d4a5c; --muted:#66717f; --muted-2:#8a93a0;
  --band-bg:#15263b; --band-fg:#ffffff; --band-muted:#b7c1cf; --band-line:#2e4360;
  --chip-spoken:#d9463b; --chip-slide:#3366b0; --chip-source:#6a3fa0; --chip-video:#8a7a2a;
  --chip-spoken-bg:#fbe9e7; --chip-slide-bg:#e6edf8; --chip-source-bg:#eee8f7; --chip-video-bg:#f3efdc;
  --seq-1:#15263b; --seq-2:#3d5a85; --seq-3:#7f98b8; --seq-4:#c3cfdf;
  --focus:#3366b0; --shadow:0 1px 2px rgba(21,38,59,.08),0 8px 24px rgba(21,38,59,.08);
  --sans:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --rail:272px; --measure:68ch;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1a29; --bg-2:#16233a; --bg-3:#1d2d47; --line:#2a3b55; --line-2:#3a4d6a;
  --fg:#e8edf3; --fg-2:#c3cdd9; --muted:#95a3b5; --muted-2:#6f7f93;
  --band-bg:#0b1420; --band-fg:#ffffff; --band-muted:#9fb0c6; --band-line:#223349;
  --red:#e06a5a; --red-ink:#f08a7c; --navy:#e8edf3; --navy-2:#c3cdd9;
  --chip-spoken:#e06a5a; --chip-slide:#5a8fd9; --chip-source:#9b74cf; --chip-video:#c9b56a;
  --chip-spoken-bg:#3a2320; --chip-slide-bg:#1c2d48; --chip-source-bg:#2b2240; --chip-video-bg:#33301c;
  --seq-1:#9fb6d4; --seq-2:#7391b8; --seq-3:#4f6d93; --seq-4:#33496a;
  --focus:#7fb0ee; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0f1a29; --bg-2:#16233a; --bg-3:#1d2d47; --line:#2a3b55; --line-2:#3a4d6a;
  --fg:#e8edf3; --fg-2:#c3cdd9; --muted:#95a3b5; --muted-2:#6f7f93;
  --band-bg:#0b1420; --band-fg:#ffffff; --band-muted:#9fb0c6; --band-line:#223349;
  --red:#e06a5a; --red-ink:#f08a7c; --navy:#e8edf3; --navy-2:#c3cdd9;
  --chip-spoken:#e06a5a; --chip-slide:#5a8fd9; --chip-source:#9b74cf; --chip-video:#c9b56a;
  --chip-spoken-bg:#3a2320; --chip-slide-bg:#1c2d48; --chip-source-bg:#2b2240; --chip-video-bg:#33301c;
  --seq-1:#9fb6d4; --seq-2:#7391b8; --seq-3:#4f6d93; --seq-4:#33496a;
  --focus:#7fb0ee; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark }

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
.menu{display:none}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto} *{animation:none!important;transition:none!important}}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.55;font-feature-settings:"kern","liga"}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band-bg)}
h1,h2,h3,h4{margin:0;line-height:1.15;text-wrap:balance;font-weight:700;color:var(--navy)}
p{margin:0}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:3px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:.86em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---- Buttons and menu lists ---- */
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:4px;font-weight:600;font-size:.9rem;text-decoration:none;border:1px solid transparent;line-height:1.2}
.btn-red{background:var(--red);color:#fff}
.btn-red:hover{filter:brightness(1.07)}
.btn-ghost{border-color:var(--band-line);color:var(--band-fg)}
.btn-ghost:hover{background:rgba(255,255,255,.06)}
.btn-line{border-color:var(--line-2);color:var(--fg)}
.btn-line:hover{background:var(--bg-2)}
.btn svg{width:16px;height:16px;flex:none}
.toc{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.toc .part{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--band-muted);margin:14px 0 6px}
.toc a{display:flex;justify-content:space-between;gap:10px;align-items:baseline;color:var(--band-fg);text-decoration:none;font-size:1rem;padding:8px 8px;border-radius:4px;border-left:2px solid transparent}
.toc a .pg{color:var(--band-muted);font-size:.75rem;font-family:var(--mono)}
.toc a[aria-current="page"]{border-left-color:var(--red);background:rgba(255,255,255,.08);font-weight:600}
/* ---- Header ---- */
.site-head{background:var(--band-bg);color:var(--band-fg);position:sticky;top:env(safe-area-inset-top,0px);z-index:20;border-bottom:1px solid var(--band-line)}
.site-head .inner{display:flex;align-items:center;gap:18px;min-height:60px;flex-wrap:wrap;padding-block:8px;max-width:1320px}
.site-head .brand{font-weight:700;font-size:1rem;text-decoration:none;color:var(--band-fg);white-space:nowrap;display:flex;flex-direction:column;line-height:1.15}
.site-head .brand small{font-weight:400;font-size:.72rem;color:var(--band-muted)}
.nav{display:flex;gap:2px;flex-wrap:wrap;flex:1;min-width:0}
.nav a{color:var(--band-muted);text-decoration:none;font-size:.8rem;padding:6px 7px;white-space:nowrap;border-radius:4px;border-bottom:2px solid transparent}
.nav a:hover{color:var(--band-fg);background:rgba(255,255,255,.06)}
.nav a[aria-current="page"]{color:var(--band-fg);border-bottom-color:var(--red);font-weight:600}
.site-head .acts{display:flex;gap:8px;margin-left:auto}
.site-head .btn{padding:7px 12px;font-size:.84rem}
.menu-btn{display:none}
.menu{display:none}
/* ---- Page hero (photo band) ---- */
.phero{position:relative;background:var(--band-bg);color:#fff;min-height:300px;display:flex;align-items:flex-end;background-size:cover;background-position:center;isolation:isolate}
.phero::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(21,38,59,.35) 0%,rgba(21,38,59,.78) 60%,rgba(21,38,59,.95) 100%);z-index:-1}
.phero .inner{padding-block:48px 34px;width:100%}
.phero .eyebrow{color:var(--band-muted)}
.phero .eyebrow .pg{color:var(--band-muted)}
.phero h1{color:#fff;font-size:clamp(1.9rem,3.8vw,2.8rem);letter-spacing:-.015em;max-width:22ch}
.phero .rule{width:88px;height:4px;background:var(--red);margin:16px 0 0}
.phero .credit{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:8px;font-size:.66rem;color:rgba(255,255,255,.65)}
.phero .credit a{color:rgba(255,255,255,.8)}
.phero.tall{min-height:460px}
.phero.tall h1{font-size:clamp(2.2rem,5vw,3.8rem);max-width:16ch}
.phero .when{color:var(--band-muted);margin-bottom:12px;font-size:.98rem}
.phero .sub{font-size:clamp(1.05rem,1.8vw,1.3rem);color:var(--band-muted);margin-top:12px;max-width:50ch}
.phero .cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}
.pageintro{padding-block:34px 0}
.pageintro .lead{max-width:var(--measure)}
.crumbs{font-size:.8rem;color:var(--muted);margin-bottom:10px}
.crumbs a{color:var(--muted)}
/* ---- Home extras ---- */
.hero-meta{display:flex;gap:28px;flex-wrap:wrap;margin-top:30px;font-size:.84rem;color:var(--muted);border-top:1px solid var(--line);padding-top:18px}
.hero-meta b{color:var(--fg);font-weight:600;display:block}
.headlines{margin:0;padding-left:0;list-style:none;counter-reset:f;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:4px 28px}
.headlines li{counter-increment:f;display:grid;grid-template-columns:34px minmax(0,1fr);gap:8px;padding:10px 0;border-bottom:1px solid var(--line);font-size:.95rem}
.headlines li::before{content:counter(f);color:var(--red);font-weight:700;font-size:1.2rem;line-height:1.1}
.headlines a{text-decoration:none;color:var(--fg);font-weight:500}
.headlines a:hover{color:var(--red-ink)}
.card-s{border:1px solid var(--line);background:var(--bg);border-radius:4px}
.res{text-decoration:none;color:inherit}
/* ---- Home cards ---- */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.card{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:var(--bg);text-decoration:none;color:inherit;min-width:0;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.card .ph{aspect-ratio:16/9;background:var(--band-bg) center/cover no-repeat;max-width:100%}
.card .ph img{width:100%;height:100%;object-fit:cover;display:block}
.card .cb{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px}
.card .k{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--red-ink);font-weight:600}
.card h3{font-size:1.05rem}
.card p{font-size:.88rem;color:var(--fg-2)}
.card .go{margin-top:auto;font-size:.82rem;font-weight:600;color:var(--navy);padding-top:8px}
.pager{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);margin-top:56px;padding-top:20px}
.pager a{text-decoration:none;color:var(--fg);font-weight:600;font-size:.9rem;display:flex;flex-direction:column;gap:2px;max-width:48%}
.pager a small{font-weight:400;color:var(--muted);font-size:.74rem;text-transform:uppercase;letter-spacing:.06em}
.pager a.next{text-align:right;margin-left:auto}
.photo-credits{font-size:.74rem;color:var(--muted);line-height:1.6}
.photo-credits a{color:var(--fg-2)}
.inline-photo{margin:28px 0;border-radius:4px;overflow:hidden;background:var(--band-bg);max-width:100%}
.inline-photo img{width:100%;display:block;aspect-ratio:21/9;object-fit:cover}
.inline-photo figcaption{font-size:.72rem;color:var(--muted);padding:6px 0 0}
.fn-foot{font-size:.8rem;color:var(--muted);border-top:1px solid var(--line);margin-top:48px;padding-top:14px}
.fn-foot h3{font-size:.74rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:8px}
.fn-foot ol{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:4px}
.fn-foot li::marker{color:var(--red-ink);font-weight:700}

/* ---- Main ---- */
main{min-width:0}
.band{background:var(--band-bg);color:var(--band-fg)}
.band h1,.band h2,.band h3{color:var(--band-fg)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.inner{max-width:1080px;margin:0 auto;padding-left:clamp(0px,4vw,56px);padding-right:clamp(0px,4vw,56px)}
section.chapter{padding-block:44px 56px}
.chapter-head{margin-bottom:34px}
.eyebrow{font-size:.74rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600;margin-bottom:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.eyebrow .pg{font-family:var(--mono);text-transform:none;letter-spacing:0;font-weight:400;color:var(--muted-2)}
.chapter-head h2{font-size:clamp(1.8rem,3.4vw,2.5rem);letter-spacing:-.015em}
.chapter-head .rule{width:88px;height:4px;background:var(--red);margin:18px 0 22px}
.lead{font-size:clamp(1.08rem,1.6vw,1.28rem);line-height:1.5;color:var(--fg);max-width:var(--measure);font-weight:400}
.band .lead{color:var(--band-fg)}
.prose{max-width:var(--measure);display:flex;flex-direction:column;gap:14px;color:var(--fg-2)}
.prose h3{font-size:1.05rem;margin-top:14px;color:var(--navy)}
.prose p{font-size:.97rem}
.grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}
.grid-3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
.note{background:var(--bg-2);border-top:3px solid var(--red);padding:16px 18px;font-size:.95rem;color:var(--fg-2);max-width:var(--measure)}
.note b{color:var(--fg)}
.cite{font-family:var(--mono);font-size:.72rem;color:var(--muted-2);white-space:nowrap}
.cite::before{content:"PDF p."}
.disclaimer{font-size:.8rem;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;margin-top:34px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* ---- Hero ---- */
.hero{padding-block:44px 56px}
.hero .top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:56px}
.hero .society{font-weight:700;font-size:1.4rem}
.badge{display:inline-block;border:1px solid var(--red);color:#fff;background:transparent;font-size:.72rem;font-weight:600;padding:4px 10px;letter-spacing:.02em}
.hero .rule{width:180px;height:6px;background:var(--red);margin-bottom:26px}
.hero .when{color:var(--band-muted);font-size:1rem;margin-bottom:14px}
.hero h1{font-size:clamp(2.2rem,5.2vw,3.9rem);letter-spacing:-.02em;max-width:16ch}
.hero .sub{font-size:clamp(1.05rem,1.8vw,1.35rem);color:var(--band-muted);margin-top:14px}
.hero .cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}
.hero .meta{display:flex;gap:28px;flex-wrap:wrap;margin-top:44px;font-size:.84rem;color:var(--band-muted)}
.hero .meta b{color:var(--band-fg);font-weight:600;display:block}
.sample-note{background:var(--bg-2);border-left:4px solid var(--red);padding:16px 20px;font-size:.95rem;color:var(--fg-2)}
.sample-note b{color:var(--fg)}

/* ---- Stat tiles ---- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin-top:28px}
.tile{background:var(--bg);padding:18px 18px 16px;min-width:0}
.tile .v{font-size:2rem;font-weight:700;letter-spacing:-.02em;color:var(--navy);line-height:1.05}
.tile .l{font-size:.82rem;color:var(--muted);margin-top:6px;line-height:1.35}
.tile .s{font-size:.72rem;color:var(--muted-2);margin-top:8px}

/* ---- Basis chips ---- */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;font-weight:600;letter-spacing:.02em;padding:2px 8px;border-radius:3px;line-height:1.5;white-space:nowrap;vertical-align:middle}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.chip-spoken{color:var(--chip-spoken);background:var(--chip-spoken-bg)}
.chip-slide{color:var(--chip-slide);background:var(--chip-slide-bg)}
.chip-both{color:var(--chip-slide);background:var(--chip-slide-bg)}
.chip-both::before{background:linear-gradient(90deg,var(--chip-spoken) 50%,var(--chip-slide) 50%)}
.chip-source{color:var(--chip-source);background:var(--chip-source-bg)}
.chip-video{color:var(--chip-video);background:var(--chip-video-bg)}
.chip-neutral{color:var(--muted);background:var(--bg-2)}
.legend{display:flex;flex-wrap:wrap;gap:14px 22px;padding:16px 0;font-size:.86rem;color:var(--fg-2)}
.legend div{display:flex;gap:10px;align-items:flex-start;max-width:320px}
.legend .chip{margin-top:2px}

/* ---- Footnotes ---- */
.fn-btn{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:3px;background:var(--chip-spoken-bg);color:var(--red-ink);font-size:.7rem;font-weight:700;vertical-align:super;line-height:1;margin-left:2px;border:1px solid transparent}
.fn-btn[aria-expanded="true"]{background:var(--red);color:#fff}
.fn-panel{border-left:3px solid var(--red);background:var(--bg-2);padding:10px 14px;font-size:.86rem;color:var(--fg-2);margin-top:10px;display:flex;gap:10px;align-items:flex-start}
.fn-panel .fn-n{font-weight:700;color:var(--red-ink);font-family:var(--mono);font-size:.78rem;flex:none;margin-top:2px}
.fn-panel .t{flex:1}
.fn-panel .t em{display:block;font-style:normal;font-size:.72rem;color:var(--muted);margin-bottom:3px;text-transform:uppercase;letter-spacing:.06em}
.fn-list{margin:20px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}

/* ---- Findings ---- */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 20px}
.filters .lbl{font-size:.78rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-right:4px}
.pill{border:1px solid var(--line-2);border-radius:999px;padding:5px 12px;font-size:.84rem;color:var(--fg-2);background:var(--bg)}
.pill:hover{border-color:var(--muted)}
.pill[aria-pressed="true"]{background:var(--navy);color:var(--bg);border-color:var(--navy)}
.findings{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.finding{display:grid;grid-template-columns:72px minmax(0,1fr);gap:16px;padding:22px 0;border-bottom:1px solid var(--line)}
.finding .n{font-size:2rem;font-weight:700;color:var(--red);line-height:1;letter-spacing:-.02em}
.finding h3{font-size:1.12rem;line-height:1.3;color:var(--navy)}
.finding .body{color:var(--fg-2);font-size:.95rem;margin-top:10px;max-width:var(--measure)}
.finding .who{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.who .tag{font-size:.76rem;border:1px solid var(--line-2);border-radius:3px;padding:2px 8px;color:var(--fg-2);background:var(--bg)}
.who .tag b{font-weight:600;color:var(--fg)}
.finding.hidden{display:none}
.finding .expand{margin-top:12px;font-size:.84rem;font-weight:600;color:var(--red-ink);display:inline-flex;gap:6px;align-items:center}
.finding .expand svg{width:12px;height:12px;transition:transform .2s}
.finding .expand[aria-expanded="true"] svg{transform:rotate(180deg)}
.finding .more{margin-top:12px}
.figs{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:12px}
.fig{border:1px solid var(--line);padding:10px 12px;background:var(--bg);min-width:0}
.fig .v{font-weight:700;font-size:1.15rem;color:var(--navy);letter-spacing:-.01em;line-height:1.1}
.fig .m{font-size:.78rem;color:var(--fg-2);margin-top:5px;line-height:1.35}
.fig .b{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.fig .b .t{font-size:.72rem;color:var(--muted);font-family:var(--mono)}

/* ---- Programme ---- */
.timeline{position:relative;border-left:2px solid var(--line-2);margin-left:62px;padding-left:28px;display:flex;flex-direction:column;gap:14px}
.sess{position:relative}
.sess .time{position:absolute;left:-92px;top:10px;font-family:var(--mono);font-size:.82rem;color:var(--muted);width:52px;text-align:right}
.sess::before{content:"";position:absolute;left:-35px;top:16px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--red)}
.sess .head{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 16px;width:100%;text-align:left}
.sess .head:hover{background:var(--bg-2)}
.sess .head h3{font-size:1rem;font-weight:600}
.sess .head .meta{font-size:.78rem;color:var(--muted);margin-top:3px}
.sess .head svg{width:14px;height:14px;flex:none;color:var(--muted);transition:transform .2s}
.sess .head[aria-expanded="true"] svg{transform:rotate(180deg)}
.sess .detail{padding:4px 16px 16px;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px 24px;font-size:.9rem}
.sess .detail h4{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:12px 0 6px;font-weight:600}
.sess .detail ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.sess .detail li{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.sess .detail li .org{color:var(--muted);font-size:.84rem}
.sess .detail li .role{font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;color:var(--chip-slide);background:var(--chip-slide-bg);padding:1px 6px;border-radius:3px;font-weight:600}
.people-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:28px 0 14px}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line-2);border-radius:4px;padding:7px 10px;background:var(--bg);flex:1;min-width:220px;max-width:420px}
.search input{border:0;outline:0;background:transparent;font:inherit;color:var(--fg);flex:1;min-width:0}
.search svg{width:16px;height:16px;color:var(--muted);flex:none}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.person{border:1px solid var(--line);padding:10px 12px;background:var(--bg);min-width:0;font-size:.88rem}
.person b{display:block;font-weight:600;color:var(--fg)}
.person .org{color:var(--muted);font-size:.8rem}
.person .r{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.person .r span{font-family:var(--mono);font-size:.68rem;color:var(--fg-2);background:var(--bg-2);padding:1px 6px;border-radius:3px}
.count{font-size:.8rem;color:var(--muted);margin-left:auto}

/* ---- Tables ---- */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:4px;background:var(--bg)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:10px 12px;vertical-align:top;border-bottom:1px solid var(--line)}
th{font-weight:600;font-size:.76rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--bg-2);white-space:nowrap;position:sticky;top:0}
tbody tr:nth-child(even){background:color-mix(in srgb,var(--bg-2) 55%,transparent)}
tbody tr:last-child td{border-bottom:0}
td b{font-weight:600;color:var(--fg)}
th button{display:inline-flex;gap:6px;align-items:center;font:inherit;text-transform:inherit;letter-spacing:inherit;color:inherit}
th button svg{width:10px;height:10px;opacity:.5}
th button[data-dir]{color:var(--fg)}
th button[data-dir] svg{opacity:1}
th button[data-dir="desc"] svg{transform:rotate(180deg)}
.status{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;white-space:nowrap}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--seq-3)}
.status[data-s="Completed"]::before{background:var(--seq-1)}
.status[data-s="Recruiting"]::before{background:var(--red)}
.status[data-s="Active, not recruiting"]::before{background:var(--seq-2)}
.status[data-s="Not yet recruiting"]::before{background:transparent;border:2px solid var(--seq-2);width:6px;height:6px}

/* ---- Lipid chart ---- */
.chart{border:1px solid var(--line);border-radius:4px;padding:18px 18px 12px;background:var(--bg);position:relative;min-width:0}
.chart h3{font-size:1rem;margin-bottom:4px}
.chart .sub{font-size:.84rem;color:var(--muted);margin-bottom:12px;max-width:70ch}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart .ax{stroke:var(--line-2);stroke-width:1}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart text{font-family:var(--sans);fill:var(--fg-2);font-size:12px}
.chart text.t{fill:var(--muted);font-size:11px}
.chart .lbl{font-weight:600;fill:var(--fg)}
.chart .mark{cursor:pointer}
.chart .mark:hover circle,.chart .mark:focus circle{stroke-width:3}
.tip{position:absolute;pointer-events:none;background:var(--navy);color:var(--bg);padding:8px 10px;border-radius:4px;font-size:.78rem;line-height:1.35;max-width:260px;box-shadow:var(--shadow);z-index:5;opacity:0;transition:opacity .12s}
.tip.on{opacity:1}
.tip b{display:block;font-weight:600}
.chart-foot{font-size:.76rem;color:var(--muted);margin-top:10px;display:flex;gap:16px;flex-wrap:wrap}
.bars{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.bar{display:grid;grid-template-columns:minmax(120px,190px) minmax(0,1fr) 60px;gap:10px;align-items:center;font-size:.86rem}
.bar .k{min-width:0}
.bar .k b{display:block;font-weight:600;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .k span{color:var(--muted);font-size:.76rem}
.bar .track{height:14px;background:var(--bg-2);border-radius:2px;overflow:hidden}
.bar .fill{height:100%;background:var(--seq-2);border-radius:0 2px 2px 0;transition:width .5s ease}
.bar.hl .fill{background:var(--red)}
.bar .v{font-weight:600;color:var(--fg);text-align:right}

/* ---- Segmented bar ---- */
.seg{display:flex;height:34px;border-radius:3px;overflow:hidden;gap:2px;background:var(--bg)}
.seg div{display:flex;align-items:center;justify-content:center;color:#fff;font-size:.8rem;font-weight:600;min-width:0}
.seg div span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px}
.seg-legend{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:.84rem;margin-top:10px;color:var(--fg-2)}
.seg-legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}

/* ---- Dates ---- */
.dates{display:flex;flex-direction:column;gap:26px}
.dgroup h3{font-size:1rem;display:flex;gap:10px;align-items:center;margin-bottom:8px}
.dgroup h3 .cnt{font-size:.74rem;color:var(--muted);font-weight:500;font-family:var(--mono)}
.dgroup .rows{border-top:1px solid var(--line)}
.drow{display:grid;grid-template-columns:150px minmax(0,1fr) 150px;gap:14px;padding:10px 0;border-bottom:1px solid var(--line);font-size:.9rem;align-items:start}
.drow .w{font-weight:600;color:var(--fg)}
.drow .c{color:var(--muted);font-size:.8rem;margin-top:2px}
.drow.hidden{display:none}

/* ---- Developments ---- */
.dev{border:1px solid var(--line);border-radius:4px;padding:16px 18px;background:var(--bg);min-width:0}
.dev h4{font-size:.98rem;color:var(--navy);margin-bottom:6px}
.dev p{font-size:.9rem;color:var(--fg-2)}
.dev .k{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;margin-bottom:8px}

/* ---- Cardio ---- */
.pres{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.pcard{border:1px solid var(--line);border-radius:4px;background:var(--bg);padding:18px 20px;min-width:0}
.pcard .top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline;margin-bottom:8px}
.pcard h3{font-size:1.05rem}
.pcard .org{color:var(--muted);font-size:.86rem}
.pcard .prod{font-size:.9rem;color:var(--fg-2);margin-bottom:12px}
.pcard .prod b{color:var(--fg)}
.pcard .text{font-size:.93rem;color:var(--fg-2);max-width:var(--measure)}
.trials-mini{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.tm{border:1px solid var(--line-2);padding:8px 10px;font-size:.8rem;min-width:140px;background:var(--bg-2)}
.tm b{display:block;font-family:var(--mono);font-size:.78rem;color:var(--fg)}
.tm span{color:var(--muted)}
.quote{border-left:4px solid var(--red);padding:6px 0 6px 18px;font-size:1.15rem;line-height:1.45;color:var(--fg);max-width:60ch;font-weight:400}
.quote cite{display:block;font-style:normal;font-size:.84rem;color:var(--muted);margin-top:10px}

/* ---- Discrepancy explorer ---- */
.disc{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.dcard{border:1px solid var(--line);border-radius:4px;background:var(--bg);padding:14px 16px;min-width:0;display:flex;flex-direction:column;gap:8px}
.dcard .ctx{font-size:.78rem;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.dcard .stmt{font-size:.88rem;color:var(--fg-2)}
.dcard .stmt b{color:var(--fg);font-weight:600}
.dcard .note{padding:10px 12px;font-size:.86rem}
.dcard.hidden{display:none}

/* ---- Method pipeline ---- */
.pipe{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;counter-reset:step}
.step{border:1px solid var(--line);border-radius:4px;padding:14px;background:var(--bg);min-width:0;position:relative}
.step::before{counter-increment:step;content:counter(step);position:absolute;top:-12px;left:12px;background:var(--red);color:#fff;font-weight:700;font-size:.74rem;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.step h4{font-size:.9rem;margin:6px 0 6px}
.step p{font-size:.82rem;color:var(--fg-2)}
.step .v{font-size:1.4rem;font-weight:700;color:var(--navy);letter-spacing:-.02em;margin-top:8px}
.step .v small{font-size:.74rem;font-weight:500;color:var(--muted);display:block;letter-spacing:0}

/* ---- Search overlay ---- */
.overlay{position:fixed;inset:0;background:rgba(21,38,59,.55);z-index:50;display:none;align-items:flex-start;justify-content:center;padding:min(12vh,90px) 16px 16px}
.overlay.on{display:flex}
.dialog{background:var(--bg);color:var(--fg);width:min(720px,100%);max-height:80vh;display:flex;flex-direction:column;border-radius:6px;box-shadow:var(--shadow);overflow:hidden}
.dialog .search{margin:12px;max-width:none}
.results{overflow:auto;padding:0 12px 12px;display:flex;flex-direction:column;gap:6px}
.res{display:block;text-align:left;border:1px solid var(--line);border-radius:4px;padding:10px 12px;font-size:.88rem;width:100%}
.res:hover{background:var(--bg-2)}
.res .where{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--red-ink);font-weight:600;margin-bottom:3px}
.res mark{background:var(--chip-video-bg);color:inherit;padding:0 1px}
.res .cite{margin-left:8px}
.hint{font-size:.78rem;color:var(--muted);padding:0 12px 12px}

/* ---- Ask the report: styled as an enquiry page of the printed report ---- */
.ask{background:var(--band-bg);color:var(--band-fg);padding:30px 32px 26px;border-radius:0;position:relative;min-width:0}
.ask::before{content:"";position:absolute;left:32px;top:0;width:88px;height:4px;background:var(--red)}
.ask .lede{font-size:.74rem;text-transform:uppercase;letter-spacing:.09em;color:var(--band-muted);font-weight:600;margin:10px 0 18px}
.ask form{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 18px;align-items:end;border-bottom:2px solid var(--red);padding-bottom:10px}
.ask textarea{background:transparent;border:0;padding:4px 0;font:inherit;font-size:clamp(1.15rem,2vw,1.5rem);line-height:1.35;color:#fff;resize:none;min-height:44px;width:100%;font-weight:500}
.ask textarea::placeholder{color:var(--band-muted);font-weight:400}
.ask textarea:focus{outline:none}
.ask form:focus-within{border-bottom-color:#fff}
.ask .go{color:var(--red);font-weight:700;font-size:1rem;white-space:nowrap;padding:6px 0;display:inline-flex;gap:8px;align-items:center}
.ask .go:hover{color:#fff}
.ask .go svg{width:18px;height:18px}
.ask .sugg{margin-top:22px}
.ask .sugg h4{font-size:.74rem;text-transform:uppercase;letter-spacing:.09em;color:var(--band-muted);font-weight:600;margin-bottom:8px}
.ask .sugg ol{margin:0;padding:0;list-style:none;columns:2;column-gap:36px}
.ask .sugg li{break-inside:avoid;padding:6px 0;border-top:1px solid var(--band-line);display:grid;grid-template-columns:24px minmax(0,1fr);gap:8px;font-size:.92rem}
.ask .sugg li::before{content:counter(sq);counter-increment:sq;color:var(--red);font-weight:700}
.ask .sugg ol{counter-reset:sq}
.ask .sugg button{text-align:left;color:var(--band-fg);line-height:1.4}
.ask .sugg button:hover{color:#fff;text-decoration:underline;text-decoration-color:var(--red);text-underline-offset:3px}
.ask .ask-status{font-size:.78rem;color:var(--band-muted);margin-top:18px;font-style:italic;line-height:1.5}
.ask .ask-status.live{color:#9fd3b0}
.ask .thread{display:flex;flex-direction:column;gap:22px;margin-top:26px}
.ask .qa{border-top:1px solid var(--band-line);padding-top:16px;display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px}
.ask .qa::before{content:"Q";font-size:1.6rem;font-weight:700;color:var(--red);line-height:1;grid-column:1;grid-row:1}
.ask .qa > *{grid-column:2}
.ask .qa .q{font-weight:600;color:#fff;font-size:1.05rem;line-height:1.35}
.ask .qa .a{margin-top:8px;font-size:.95rem;color:var(--band-muted);white-space:pre-wrap}
.ask .qa .a.err{color:#f0a89e}
.ask .srcs{display:flex;flex-direction:column;gap:0;margin-top:10px;border-top:1px solid var(--band-line)}
.ask .src{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;padding:10px 0;border-bottom:1px solid var(--band-line);text-decoration:none;color:var(--band-fg);font-size:.88rem;min-width:0}
.ask .src:hover .t{color:#fff}
.ask .src b{font-family:var(--mono);font-weight:500;font-size:.78rem;color:var(--red);letter-spacing:0;text-transform:none;margin:0}
.ask .src .t{color:var(--band-muted);line-height:1.45}
.ask .src .w{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--band-muted);margin-bottom:2px;font-weight:600}
.ask .src mark{background:transparent;color:#fff;font-weight:600}
.ask .more{font-size:.8rem;margin-top:8px;color:var(--band-muted)}
.ask .more a{color:var(--band-fg)}
.ask .hint{color:var(--band-muted)}
@media (max-width:700px){.ask{padding:24px 18px 20px}.ask::before{left:18px}.ask .sugg ol{columns:1}.ask form{grid-template-columns:1fr}.ask .qa{grid-template-columns:36px minmax(0,1fr)}.ask .src{grid-template-columns:56px minmax(0,1fr)}}
/* ---- Quote slider ---- */
.qslider{position:relative;background:var(--band-bg);color:var(--band-fg);border-radius:6px;padding:26px 28px 22px;overflow:hidden;isolation:isolate;min-width:0}
.qslider::before{content:"\201C";position:absolute;left:18px;top:-18px;font-size:7rem;line-height:1;color:var(--red);opacity:.55;font-weight:700;z-index:-1}
.qslider .track{display:flex;transition:transform .45s cubic-bezier(.2,.7,.2,1)}
.qslider .slide{flex:0 0 100%;min-width:0;padding:0 2px}
.qslider .q{font-size:clamp(1.05rem,1.7vw,1.3rem);line-height:1.45;font-weight:500;color:#fff;max-width:60ch;text-wrap:pretty}
.qslider .who{margin-top:14px;font-size:.84rem;color:var(--band-muted)}
.qslider .who b{color:#fff;font-weight:600}
.qslider .ctl{display:flex;align-items:center;gap:10px;margin-top:18px}
.qslider .ctl button{width:32px;height:32px;border:1px solid var(--band-line);border-radius:50%;color:#fff;display:inline-flex;align-items:center;justify-content:center}
.qslider .ctl button:hover{background:rgba(255,255,255,.08)}
.qslider .ctl svg{width:14px;height:14px}
.qslider .dots{display:flex;gap:6px;margin-left:6px}
.qslider .dots button{width:8px;height:8px;border-radius:50%;background:var(--band-line);border:0;padding:0}
.qslider .dots button[aria-current="true"]{background:var(--red);width:22px;border-radius:4px}
.qslider .sess-tag{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--band-muted);margin-bottom:12px;font-weight:600}
.qslider.compact{padding:18px 20px 16px;margin-top:10px}
.qslider.compact .q{font-size:.98rem}
.qslider.compact::before{font-size:5rem;top:-10px}
/* ---- Review facility ---- */
.rv-fab{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--navy);color:var(--bg);border-radius:999px;padding:11px 16px;font-weight:600;font-size:.86rem;box-shadow:var(--shadow);display:inline-flex;gap:8px;align-items:center}
.rv-fab svg{width:16px;height:16px}
.rv-fab.on{background:var(--red);color:#fff}
.rv-modal{position:fixed;inset:0;background:rgba(21,38,59,.55);z-index:60;display:none;align-items:center;justify-content:center;padding:16px}
.rv-modal.on{display:flex}
.rv-dialog{background:var(--bg);color:var(--fg);width:min(440px,100%);border-radius:6px;box-shadow:var(--shadow);padding:22px 24px}
.rv-dialog h3{font-size:1.1rem;margin-bottom:6px}
.rv-dialog p{font-size:.88rem;color:var(--fg-2)}
.rv-dialog label{display:block;font-size:.78rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:14px 0 6px}
.rv-dialog input,.rv-dialog textarea{width:100%;border:1px solid var(--line-2);border-radius:4px;padding:9px 11px;font:inherit;color:var(--fg);background:var(--bg)}
.rv-dialog .row{display:flex;gap:8px;margin-top:16px;justify-content:flex-end;flex-wrap:wrap}
.rv-tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:6px}
.rv-tabs button{padding:8px 12px;font-size:.86rem;font-weight:600;color:var(--muted);border-bottom:2px solid transparent}
.rv-tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--red)}
.rv-err{color:var(--red-ink);font-size:.84rem;margin-top:8px}
.rv-code{font-family:var(--mono);letter-spacing:.3em;font-size:1.2rem;text-align:center}
body.reviewing [data-anchor]{position:relative;outline:1px dashed transparent;outline-offset:6px;border-radius:3px;transition:outline-color .15s}
body.reviewing [data-anchor]:hover{outline-color:var(--red);cursor:pointer}
body.reviewing [data-anchor]:hover::after{content:"Comment or propose an edit";position:absolute;right:0;top:-24px;font-size:.68rem;font-weight:600;background:var(--red);color:#fff;padding:2px 8px;border-radius:3px;letter-spacing:.03em}
.rv-badge{display:inline-flex;align-items:center;gap:5px;font-size:.68rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:3px;margin-left:8px;vertical-align:middle;white-space:nowrap}
.rv-badge.review{background:var(--chip-video-bg);color:#6b5a12}
.rv-badge.approved{background:#e3f2e8;color:#246b3b}
.rv-badge.rejected{background:var(--bg-2);color:var(--muted)}
.rv-edit{background:#e3f2e8;border-bottom:2px solid #3f8f5a;cursor:help}
.rv-edit del{color:var(--muted);text-decoration:line-through;display:none}
.rv-edit.show del{display:inline;margin-right:4px}
.rv-panel{position:fixed;top:calc(70px + env(safe-area-inset-top,0px));right:calc(18px + env(safe-area-inset-right,0px));width:min(380px,calc(100vw - 32px));max-height:calc(100vh - 110px);overflow:auto;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);z-index:40;padding:16px 18px;display:none}
.rv-panel.on{display:block}
.rv-panel h4{font-size:.95rem;margin-bottom:6px}
.rv-panel .orig{font-size:.82rem;color:var(--fg-2);background:var(--bg-2);padding:8px 10px;border-left:3px solid var(--line-2);max-height:120px;overflow:auto;margin:8px 0}
.rv-panel textarea{width:100%;min-height:90px;border:1px solid var(--line-2);border-radius:4px;padding:8px 10px;font:inherit;font-size:.9rem;color:var(--fg);background:var(--bg)}
.rv-panel .list{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.rv-item{border:1px solid var(--line);border-radius:4px;padding:10px 12px;font-size:.84rem}
.rv-item .m{font-size:.72rem;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.rv-item .m b{color:var(--fg);font-weight:600}
.rv-item .diff{margin-top:6px;font-size:.82rem}
.rv-item .diff del{color:var(--red-ink);background:var(--chip-spoken-bg);text-decoration:line-through}
.rv-item .diff ins{color:#246b3b;background:#e3f2e8;text-decoration:none}
.rv-item .acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.rv-item .acts button{font-size:.78rem;font-weight:600;padding:5px 10px;border-radius:4px;border:1px solid var(--line-2)}
.rv-item .acts .ok{background:#246b3b;color:#fff;border-color:#246b3b}
.rv-item .acts .no{color:var(--red-ink)}
.rv-presence{font-size:.78rem;color:var(--muted);margin-top:8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.rv-presence i{width:8px;height:8px;border-radius:50%;background:#3f8f5a;display:inline-block}
.rv-bar{background:var(--chip-video-bg);color:#6b5a12;font-size:.84rem;padding:8px 0;text-align:center}
.rv-bar.admin{background:#e3f2e8;color:#246b3b}
.rv-bar button{font-weight:600;text-decoration:underline;margin-left:10px}
.rv-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin:0 0 24px}
